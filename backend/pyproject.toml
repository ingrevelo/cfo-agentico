[project]
name = "cfo-agentico-backend"
version = "0.1.0"
description = "Backend hexagonal para CFO Agéntico (FastAPI, dominio determinista, agente y SQLite)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.14",
    "fastapi>=0.115.0",
    "mcp>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/listar_tools_belo.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
