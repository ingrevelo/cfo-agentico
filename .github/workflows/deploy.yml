# Construye la imagen con cada merge a main y la publica en ghcr.io.
# No entra al servidor: el droplet la trae solo con el temporizador cfo-actualizar (ver deploy/README.md).
name: imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ¿Ya existen el backend y el frontend?
        id: listo
        run: |
          if [ -f backend/pyproject.toml ] && [ -f frontend/package.json ]; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "Todavía no hay backend/pyproject.toml o frontend/package.json: no se construye la imagen."
            echo "si=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.listo.outputs.si == 'true'

      - uses: docker/login-action@v3
        if: steps.listo.outputs.si == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.listo.outputs.si == 'true'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ingrevelo/cfo-agentico:latest
            ghcr.io/ingrevelo/cfo-agentico:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
